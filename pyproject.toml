[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroroute"
version = "0.1.0"
description = "Generate deterministic SVG flight maps from ADS-B CSV tracks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aeroroute = "aeroroute.cli:main"

[tool.setuptools.package-data]
aeroroute = ["data/*.geojson", "data/*.md"]

